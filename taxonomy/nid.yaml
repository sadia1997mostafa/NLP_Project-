          - "General distribution-date questions"

      NID_SMART_GENERAL_PROBLEM:
        display_name: "General Smart NID Problem"
        description: >
          Smart NID problems where the citizen identifies a
          Smart Card issue but does not provide enough information
          to route it to eligibility, registration, application,
          status, collection, distribution or delay.
        includes:
          - "I have a problem with my Smart NID"
          - "My Smart NID is not working"
          - "Where can I get help with my Smart NID?"
          - "Smart NID information is not displaying correctly"
          - "General Smart Card service problem"
        excludes:
