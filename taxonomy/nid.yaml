taxonomy_version: "0.2.0"
service_id: "NID"
status: "draft_reviewed"

description: >
  Working parent-topic taxonomy for National Identity Card and
  voter-related citizen queries. This structure is derived from the
  existing NID query inventory and coverage audit. Query-topic IDs
  will be defined separately before the taxonomy is frozen into the
  shared contract.

parent_topics:

  NID_REGISTRATION:
    display_name: "NID / Voter Registration"
    description: >
      First-time NID or voter registration and closely related
      registration procedures.

    covers:
      - "New NID / New Voter Registration"
      - "Expatriate NID Registration"
      - "NID Validity / Re-registration"

    query_topics:

      NID_REGISTRATION_ELIGIBILITY:
        display_name: "Registration Eligibility"
        description: >
          General questions about who is eligible to register for
          an NID or become a voter for the first time.
        includes:
          - "Who can apply for a new NID?"
          - "Citizenship eligibility"
          - "General voter eligibility conditions"
        excludes:
          - "Questions specifically about minimum age"
          - "Questions specifically about registering late"

      NID_REGISTRATION_AGE_ELIGIBILITY:
        display_name: "Registration Age Requirement"
        description: >
          Questions specifically about minimum age, age limits,
          or whether a person of a stated age can register.
        includes:
          - "Minimum age for NID"
          - "Whether someone under 18 can register"
          - "Age requirement for becoming a voter"
        excludes:
          - "General eligibility without an age question"
          - "Late registration by an older applicant"

      NID_REGISTRATION_PROCESS:
        display_name: "First-Time Registration Process"
        description: >
          General or end-to-end questions about how to obtain
          an NID or register as a voter for the first time.
        includes:
          - "How to register for the first time"
          - "Step-by-step registration process"
          - "Where to start"
          - "Complete registration procedure"
        excludes:
          - "Online-only application questions"
          - "Questions specifically about documents, biometrics or appointments"

      NID_REGISTRATION_ONLINE_APPLICATION:
        display_name: "Online Registration Application"
        description: >
          Questions about whether or how a first-time NID or voter
          registration application can be started or submitted online.
        includes:
          - "Online application procedure"
          - "Online registration website"
          - "Applying from home"
          - "Online submission"
        excludes:
          - "NID portal account/login problems"
          - "General registration procedure not specifically online"

      NID_REGISTRATION_REQUIRED_DOCUMENTS:
        display_name: "Required Registration Documents"
        description: >
          Questions asking which documents or supporting evidence
          are required for first-time NID registration.
        includes:
          - "Required document list"
          - "Birth certificate requirement"
          - "Parents' document requirement"
          - "Educational certificate requirement"
        excludes:
          - "What to do when required documents are unavailable"

      NID_REGISTRATION_APPLICATION_FORM:
        display_name: "Registration Application Form"
        description: >
          Questions about obtaining, completing, submitting or
          correcting the first-time registration application form.
        includes:
          - "Where to get the application form"
          - "How to fill the form"
          - "How to submit the form"
          - "Mistake in the application form"
          - "Information requested by a specific form field"
        excludes:
          - "General list of required personal information"

      NID_REGISTRATION_APPLICATION_LOCATION:
        display_name: "Registration Office or Application Location"
        description: >
          Questions about the office, registration center or physical
          location where a citizen should apply.
        includes:
          - "Where to apply"
          - "Which election office to visit"
          - "Local registration center"
          - "Whether an office visit is required"
        excludes:
          - "Which voter area the citizen should belong to"

      NID_REGISTRATION_BIOMETRIC:
        display_name: "Registration Biometric Process"
        description: >
          Questions about fingerprint, photograph, personal appearance
          and other biometric steps during registration.
        includes:
          - "Fingerprint requirement"
          - "Where biometrics are provided"
          - "Personal attendance for biometrics"
          - "What happens during biometric registration"
        excludes:
          - "Questions specifically about booking an appointment"

      NID_REGISTRATION_AREA_SELECTION:
        display_name: "Voter Registration Area Selection"
        description: >
          Questions about which geographic voter area should be used
          during first-time registration.
        includes:
          - "Present-address voter area"
          - "Permanent-address voter area"
          - "Different current and permanent locations"
          - "How registration area is determined"
        excludes:
          - "Changing voter area after already being registered"
          - "How to fill present/permanent address fields"

      NID_REGISTRATION_APPOINTMENT:
        display_name: "Registration Appointment"
        description: >
          Questions about whether an appointment is required and how
          to schedule, check or handle a registration or biometric appointment.
        includes:
          - "Appointment booking"
          - "Online appointment"
          - "Appointment date"
          - "Missed appointment"
        excludes:
          - "General biometric procedure"

      NID_REGISTRATION_ADDRESS_FIELDS:
        display_name: "Present and Permanent Address in Registration"
        description: >
          Questions about entering present and permanent addresses
          in a first-time NID application.
        includes:
          - "Meaning of present versus permanent address"
          - "Which address to enter"
          - "Different present and permanent addresses"
        excludes:
          - "Selecting a voter area"
          - "Correcting an address on an existing NID"

      NID_REGISTRATION_VERIFICATION:
        display_name: "Registration Verification"
        description: >
          Questions specifically about the verification stage of a
          new NID or voter registration application.
        includes:
          - "How verification works"
          - "Meaning of verification status"
          - "Physical verification"
          - "Verification requirements"
          - "Verification processing time"
        excludes:
          - "Generic application pending or delayed status"

      NID_REGISTRATION_PHYSICAL_CARD_COLLECTION:
        display_name: "First NID Card Collection"
        description: >
          Questions about receiving or collecting the physical NID
          card after first-time registration.
        includes:
          - "When the physical card will be received"
          - "Where the physical card is collected"
          - "Card not received after registration"
        excludes:
          - "Smart NID Card-specific questions"
          - "Replacement of a lost or damaged card"

      NID_REGISTRATION_REQUIRED_INFORMATION:
        display_name: "Required Registration Information"
        description: >
          Questions asking what personal information or details must
          be supplied during first-time registration.
        includes:
          - "Required personal information"
          - "Parents' information"
          - "Mandatory registration information"
          - "Which information is verified"
        excludes:
          - "Required supporting documents"
          - "How to fill a particular form field"

      NID_REGISTRATION_MISSING_DOCUMENTS:
        display_name: "Missing or Incomplete Registration Documents"
        description: >
          Questions about registering when one or more required
          documents are missing, lost or unavailable.
        includes:
          - "No birth certificate"
          - "Incomplete documents"
          - "Lost required document"
          - "Alternative documentation"
        excludes:
          - "General document-list questions"

      NID_REGISTRATION_REFERENCE_RECOVERY:
        display_name: "Registration Reference Recovery"
        description: >
          Questions about recovering a lost application number,
          application ID, registration slip, reference number or
          tracking information.
        includes:
          - "Lost application number"
          - "Lost registration slip"
          - "Lost application ID"
          - "Lost tracking information"

      NID_REGISTRATION_LATE_REGISTRATION:
        display_name: "Late First-Time Registration"
        description: >
          Questions from citizens who did not register at the usual
          time and now want to become a voter or obtain an NID.
        includes:
          - "Registering many years late"
          - "Older first-time applicant"
          - "Never registered before"
          - "Late registration procedure"
        excludes:
          - "Ordinary minimum-age eligibility"

      NID_REGISTRATION_CANCELLATION:
        display_name: "Registration Application Cancellation"
        description: >
          Questions about cancelling or withdrawing a submitted
          first-time NID or voter registration application.
        includes:
          - "Cancel application"
          - "Withdraw submitted application"
          - "Application submitted by mistake"

      NID_REGISTRATION_PROCESSING_TIME:
        display_name: "Normal Registration Processing Time"
        description: >
          Questions about the normal expected time required to
          complete first-time registration or receive the NID.
        includes:
          - "How long registration normally takes"
          - "Expected processing duration"
          - "Normal application-to-NID timeline"
        excludes:
          - "An application that is already unusually delayed"
          - "A specific pending application"

  NID_CORRECTION:
    display_name: "NID Information Correction"
    description: >
      Correction or updating of personal information recorded
      on an existing NID.

    covers:
      - "Name Change / Name Correction"
      - "Father/Mother Name Correction"
      - "Date of Birth Correction"
      - "Gender Correction"
      - "Blood Group Correction"
      - "Marital Status Correction"
      - "Spouse Name Correction"
      - "Address Correction"
      - "Photo Change / Correction"
      - "Signature Change / Correction"

    query_topics:

      NID_CORRECTION_NAME:
        display_name: "Own Name Correction"
        description: >
          Correction, spelling correction, addition, removal or
          modification of the NID holder's own name.
        includes:
          - "Wrong own name"
          - "Name spelling mistake"
          - "Missing part of own name"
          - "Own name differs from certificate or other document"
          - "Procedure or documents for own-name correction"
        excludes:
          - "Father or mother's name"
          - "Spouse's name"
          - "A generic document mismatch involving another field"

      NID_CORRECTION_PARENT_NAME:
        display_name: "Father or Mother Name Correction"
        description: >
          Correction or updating of the NID holder's father or
          mother's name.
        includes:
          - "Father's name incorrect"
          - "Mother's name incorrect"
          - "Parent-name spelling error"
          - "Parent name differs from supporting documents"
          - "Documents or procedure for parent-name correction"
        excludes:
          - "Citizen's own name"
          - "Spouse information"

      NID_CORRECTION_DOB:
        display_name: "Date of Birth Correction"
        description: >
          Correction of an incorrect date, day, month or year of
          birth recorded on the NID.
        includes:
          - "Wrong date of birth"
          - "Wrong birth year"
          - "Wrong day or month"
          - "NID birth date differs from birth registration"
          - "Documents or procedure for date-of-birth correction"
        excludes:
          - "Age eligibility for first-time registration"

      NID_CORRECTION_GENDER:
        display_name: "Gender Information Correction"
        description: >
          Correction or updating of gender information recorded
          incorrectly on an existing NID.
        includes:
          - "Incorrect gender"
          - "Incorrect male/female designation"
          - "Gender information differs from supporting documents"
          - "Procedure or documents for gender correction"

      NID_CORRECTION_BLOOD_GROUP:
        display_name: "Blood Group Correction"
        description: >
          Correction or updating of blood-group information
          recorded on an existing NID.
        includes:
          - "Wrong blood group"
          - "Blood-group update"
          - "Documents or proof for blood-group correction"

      NID_CORRECTION_MARITAL_STATUS:
        display_name: "Marital Status Correction"
        description: >
          Correction or updating of marital-status information
          such as married or unmarried status.
        includes:
          - "Incorrect marital status"
          - "Status still shows unmarried after marriage"
          - "Marital-status update"
          - "Documents or procedure for marital-status correction"
        excludes:
          - "Adding or correcting the spouse's actual name"

      NID_CORRECTION_SPOUSE_NAME:
        display_name: "Spouse Name Correction"
        description: >
          Addition, correction or updating of husband or wife
          information recorded on the NID.
        includes:
          - "Incorrect spouse name"
          - "Spouse-name spelling correction"
          - "Adding husband or wife name"
          - "Updating spouse information"
          - "Documents or procedure for spouse-name correction"
        excludes:
          - "Changing only married/unmarried status"

      NID_CORRECTION_ADDRESS:
        display_name: "Address Correction"
        description: >
          Correction, addition or updating of address information
          recorded on an existing NID.
        includes:
          - "Incorrect address"
          - "Current address missing"
          - "Address update after moving"
          - "Incorrect village or area name"
          - "Documents or procedure for address correction"
        excludes:
          - "Transferring the citizen's voter area"
          - "Choosing a voter area during first-time registration"

      NID_CORRECTION_PHOTO:
        display_name: "Photo Change or Correction"
        description: >
          Updating or replacing the photograph associated with
          an existing NID.
        includes:
          - "Old photograph"
          - "Poor-quality photograph"
          - "Request to provide a new photograph"
          - "Photo-change procedure"
        excludes:
          - "Biometric photograph taken during first-time registration"

      NID_CORRECTION_SIGNATURE:
        display_name: "Signature Change or Correction"
        description: >
          Correction, replacement or updating of the signature
          associated with an existing NID.
        includes:
          - "Incorrect signature"
          - "Old signature needs replacement"
          - "Changed signature"
          - "Signature-update procedure"
          - "Requirements for signature correction"

  NID_REPLACEMENT:
    display_name: "Lost, Stolen, Damaged or Duplicate NID"
    description: >
      Replacement, duplicate or reissue procedures for an NID
      that is lost, stolen, damaged or otherwise requires replacement.
    covers:
      - "Lost/Damaged NID / Duplicate"

  NID_ONLINE_SERVICES:
    display_name: "NID Online Account and Portal"
    description: >
      NID portal accounts, login, password recovery, OTP,
      verification and other online-service access issues.
    covers:
      - "NID Online Account / Portal"

  NID_SMART_CARD:
    display_name: "Smart NID Card"
    description: >
      Smart NID eligibility, application, status, distribution,
      collection, delay and related Smart Card issues.
    covers:
      - "Smart NID Card"

  NID_STATUS_AND_ACCESS:
    display_name: "NID Status and Document Access"
    description: >
      Queries about obtaining existing NID information or accessing
      the user's NID record/document and checking relevant status.
    covers:
      - "NID Download"
      - "NID Number Retrieval"
      - "NID/Voter Registration Status"

  NID_VOTER_SERVICES:
    display_name: "Voter Record and Electoral Services"
    description: >
      Voter-record operations that are distinct from ordinary
      correction of personal NID information.
    covers:
      - "Voter Area Migration"
      - "Vote Center Information"
      - "Deceased Voter / Voter Deletion"

  NID_FEES_AND_PAYMENT:
    display_name: "NID Fees and Payment"
    description: >
      General NID service fees, payment methods, payment status,
      receipts and related payment questions.
    covers:
      - "NID Fees & Payment"

  NID_GENERAL_INFORMATION:
    display_name: "General NID Information"
    description: >
      General eligibility, service information or NID questions
      that do not yet belong to a more specific supported workflow.
    covers:
      - "General NID Eligibility & Information"


design_rules:

  - >
    Parent topics describe broad citizen-service areas. Specific
    information needs will be represented as query-topic IDs beneath
    these parents.

  - >
    The existing spreadsheet problem labels are source labels only
    and do not define the final hierarchy.

  - >
    Voter Area Migration is separated from ordinary Address Correction
    because changing residential information and transferring a voter
    area represent different citizen service needs.

  - >
    Status/document-access queries are separated from portal-account
    problems. For example, downloading an NID and recovering a portal
    password should not be the same intent family.

  - >
    Generic fee/payment questions belong to NID_FEES_AND_PAYMENT.
    Operation-specific fee questions may later be routed to a more
    specific query topic if the query clearly identifies the operation.

  - >
    NID_GENERAL_INFORMATION must not become a catch-all class for
    ambiguous queries. Low-confidence or unsupported queries will
    eventually use clarification/OOD handling instead.


source_dataset_mapping:

  "NID Information Correction":
    primary_parent: "NID_CORRECTION"

  "New NID Registration":
    primary_parent: "NID_REGISTRATION"

  "Lost/Stolen NID":
    primary_parent: "NID_REPLACEMENT"

  "NID Online Problem":
    primary_parent: "NID_ONLINE_SERVICES"

  "Smart ID Card":
    primary_parent: "NID_SMART_CARD"


freeze_status:
  shared_contract_frozen: false
  parent_topics_reviewed: true
  query_topics_defined: false
  inclusion_exclusion_rules_defined: false
