taxonomy_version: "0.2.0"
service_id: "NID"
status: "draft_reviewed"

description: >
  Working parent-topic taxonomy for National Identity Card and
  voter-related citizen queries. This structure is derived from the
  existing NID query inventory and coverage audit. Query-topic IDs
  will be defined separately before the taxonomy is frozen into the
  shared contract.

parent_topics:

  NID_REGISTRATION:
    display_name: "NID / Voter Registration"
    description: >
      First-time NID or voter registration and closely related
      registration procedures.

    covers:
      - "New NID / New Voter Registration"
      - "Expatriate NID Registration"
      - "NID Validity / Re-registration"

    query_topics:

      NID_REGISTRATION_ELIGIBILITY:
        display_name: "Registration Eligibility"
        description: >
          General questions about who is eligible to register for
          an NID or become a voter for the first time.
        includes:
          - "Who can apply for a new NID?"
          - "Citizenship eligibility"
          - "General voter eligibility conditions"
        excludes:
          - "Questions specifically about minimum age"
          - "Questions specifically about registering late"

      NID_REGISTRATION_AGE_ELIGIBILITY:
        display_name: "Registration Age Requirement"
        description: >
          Questions specifically about minimum age, age limits,
          or whether a person of a stated age can register.
        includes:
          - "Minimum age for NID"
          - "Whether someone under 18 can register"
          - "Age requirement for becoming a voter"
        excludes:
          - "General eligibility without an age question"
          - "Late registration by an older applicant"

      NID_REGISTRATION_PROCESS:
        display_name: "First-Time Registration Process"
        description: >
          General or end-to-end questions about how to obtain
          an NID or register as a voter for the first time.
        includes:
          - "How to register for the first time"
          - "Step-by-step registration process"
          - "Where to start"
          - "Complete registration procedure"
        excludes:
          - "Online-only application questions"
          - "Questions specifically about documents, biometrics or appointments"

      NID_REGISTRATION_ONLINE_APPLICATION:
        display_name: "Online Registration Application"
        description: >
          Questions about whether or how a first-time NID or voter
          registration application can be started or submitted online.
        includes:
          - "Online application procedure"
          - "Online registration website"
          - "Applying from home"
          - "Online submission"
        excludes:
          - "NID portal account/login problems"
          - "General registration procedure not specifically online"

      NID_REGISTRATION_REQUIRED_DOCUMENTS:
        display_name: "Required Registration Documents"
        description: >
          Questions asking which documents or supporting evidence
          are required for first-time NID registration.
        includes:
          - "Required document list"
          - "Birth certificate requirement"
          - "Parents' document requirement"
          - "Educational certificate requirement"
        excludes:
          - "What to do when required documents are unavailable"

      NID_REGISTRATION_APPLICATION_FORM:
        display_name: "Registration Application Form"
        description: >
          Questions about obtaining, completing, submitting or
          correcting the first-time registration application form.
        includes:
          - "Where to get the application form"
          - "How to fill the form"
          - "How to submit the form"
          - "Mistake in the application form"
          - "Information requested by a specific form field"
        excludes:
          - "General list of required personal information"

      NID_REGISTRATION_APPLICATION_LOCATION:
        display_name: "Registration Office or Application Location"
        description: >
          Questions about the office, registration center or physical
          location where a citizen should apply.
        includes:
          - "Where to apply"
          - "Which election office to visit"
          - "Local registration center"
          - "Whether an office visit is required"
        excludes:
          - "Which voter area the citizen should belong to"

      NID_REGISTRATION_BIOMETRIC:
        display_name: "Registration Biometric Process"
        description: >
          Questions about fingerprint, photograph, personal appearance
          and other biometric steps during registration.
        includes:
          - "Fingerprint requirement"
          - "Where biometrics are provided"
          - "Personal attendance for biometrics"
          - "What happens during biometric registration"
        excludes:
          - "Questions specifically about booking an appointment"

      NID_REGISTRATION_AREA_SELECTION:
        display_name: "Voter Registration Area Selection"
        description: >
          Questions about which geographic voter area should be used
          during first-time registration.
        includes:
          - "Present-address voter area"
          - "Permanent-address voter area"
          - "Different current and permanent locations"
          - "How registration area is determined"
        excludes:
          - "Changing voter area after already being registered"
          - "How to fill present/permanent address fields"

      NID_REGISTRATION_APPOINTMENT:
        display_name: "Registration Appointment"
        description: >
          Questions about whether an appointment is required and how
          to schedule, check or handle a registration or biometric appointment.
        includes:
          - "Appointment booking"
          - "Online appointment"
          - "Appointment date"
          - "Missed appointment"
        excludes:
          - "General biometric procedure"

      NID_REGISTRATION_ADDRESS_FIELDS:
        display_name: "Present and Permanent Address in Registration"
        description: >
          Questions about entering present and permanent addresses
          in a first-time NID application.
        includes:
          - "Meaning of present versus permanent address"
          - "Which address to enter"
          - "Different present and permanent addresses"
        excludes:
          - "Selecting a voter area"
          - "Correcting an address on an existing NID"

      NID_REGISTRATION_VERIFICATION:
        display_name: "Registration Verification"
        description: >
          Questions specifically about the verification stage of a
          new NID or voter registration application.
        includes:
          - "How verification works"
          - "Meaning of verification status"
          - "Physical verification"
          - "Verification requirements"
          - "Verification processing time"
        excludes:
          - "Generic application pending or delayed status"

      NID_REGISTRATION_PHYSICAL_CARD_COLLECTION:
        display_name: "First NID Card Collection"
        description: >
          Questions about receiving or collecting the physical NID
          card after first-time registration.
        includes:
          - "When the physical card will be received"
          - "Where the physical card is collected"
          - "Card not received after registration"
        excludes:
          - "Smart NID Card-specific questions"
          - "Replacement of a lost or damaged card"

      NID_REGISTRATION_REQUIRED_INFORMATION:
        display_name: "Required Registration Information"
        description: >
          Questions asking what personal information or details must
          be supplied during first-time registration.
        includes:
          - "Required personal information"
          - "Parents' information"
          - "Mandatory registration information"
          - "Which information is verified"
        excludes:
          - "Required supporting documents"
          - "How to fill a particular form field"

      NID_REGISTRATION_MISSING_DOCUMENTS:
        display_name: "Missing or Incomplete Registration Documents"
        description: >
          Questions about registering when one or more required
          documents are missing, lost or unavailable.
        includes:
          - "No birth certificate"
          - "Incomplete documents"
          - "Lost required document"
          - "Alternative documentation"
        excludes:
          - "General document-list questions"

      NID_REGISTRATION_REFERENCE_RECOVERY:
        display_name: "Registration Reference Recovery"
        description: >
          Questions about recovering a lost application number,
          application ID, registration slip, reference number or
          tracking information.
        includes:
          - "Lost application number"
          - "Lost registration slip"
          - "Lost application ID"
          - "Lost tracking information"

      NID_REGISTRATION_LATE_REGISTRATION:
        display_name: "Late First-Time Registration"
        description: >
          Questions from citizens who did not register at the usual
          time and now want to become a voter or obtain an NID.
        includes:
          - "Registering many years late"
          - "Older first-time applicant"
          - "Never registered before"
          - "Late registration procedure"
        excludes:
          - "Ordinary minimum-age eligibility"

      NID_REGISTRATION_CANCELLATION:
        display_name: "Registration Application Cancellation"
        description: >
          Questions about cancelling or withdrawing a submitted
          first-time NID or voter registration application.
        includes:
          - "Cancel application"
          - "Withdraw submitted application"
          - "Application submitted by mistake"

      NID_REGISTRATION_PROCESSING_TIME:
        display_name: "Normal Registration Processing Time"
        description: >
          Questions about the normal expected time required to
          complete first-time registration or receive the NID.
        includes:
          - "How long registration normally takes"
          - "Expected processing duration"
          - "Normal application-to-NID timeline"
        excludes:
          - "An application that is already unusually delayed"
          - "A specific pending application"

  NID_CORRECTION:
    display_name: "NID Information Correction"
    description: >
      Correction or updating of personal information recorded
      on an existing NID.

    covers:
      - "Name Change / Name Correction"
      - "Father/Mother Name Correction"
      - "Date of Birth Correction"
      - "Gender Correction"
      - "Blood Group Correction"
      - "Marital Status Correction"
      - "Spouse Name Correction"
      - "Address Correction"
      - "Photo Change / Correction"
      - "Signature Change / Correction"

    query_topics:

      NID_CORRECTION_NAME:
        display_name: "Own Name Correction"
        description: >
          Correction, spelling correction, addition, removal or
          modification of the NID holder's own name.
        includes:
          - "Wrong own name"
          - "Name spelling mistake"
          - "Missing part of own name"
          - "Own name differs from certificate or other document"
          - "Procedure or documents for own-name correction"
        excludes:
          - "Father or mother's name"
          - "Spouse's name"
          - "A generic document mismatch involving another field"

      NID_CORRECTION_PARENT_NAME:
        display_name: "Father or Mother Name Correction"
        description: >
          Correction or updating of the NID holder's father or
          mother's name.
        includes:
          - "Father's name incorrect"
          - "Mother's name incorrect"
          - "Parent-name spelling error"
          - "Parent name differs from supporting documents"
          - "Documents or procedure for parent-name correction"
        excludes:
          - "Citizen's own name"
          - "Spouse information"

      NID_CORRECTION_DOB:
        display_name: "Date of Birth Correction"
        description: >
          Correction of an incorrect date, day, month or year of
          birth recorded on the NID.
        includes:
          - "Wrong date of birth"
          - "Wrong birth year"
          - "Wrong day or month"
          - "NID birth date differs from birth registration"
          - "Documents or procedure for date-of-birth correction"
        excludes:
          - "Age eligibility for first-time registration"

      NID_CORRECTION_GENDER:
        display_name: "Gender Information Correction"
        description: >
          Correction or updating of gender information recorded
          incorrectly on an existing NID.
        includes:
          - "Incorrect gender"
          - "Incorrect male/female designation"
          - "Gender information differs from supporting documents"
          - "Procedure or documents for gender correction"

      NID_CORRECTION_BLOOD_GROUP:
        display_name: "Blood Group Correction"
        description: >
          Correction or updating of blood-group information
          recorded on an existing NID.
        includes:
          - "Wrong blood group"
          - "Blood-group update"
          - "Documents or proof for blood-group correction"

      NID_CORRECTION_MARITAL_STATUS:
        display_name: "Marital Status Correction"
        description: >
          Correction or updating of marital-status information
          such as married or unmarried status.
        includes:
          - "Incorrect marital status"
          - "Status still shows unmarried after marriage"
          - "Marital-status update"
          - "Documents or procedure for marital-status correction"
        excludes:
          - "Adding or correcting the spouse's actual name"

      NID_CORRECTION_SPOUSE_NAME:
        display_name: "Spouse Name Correction"
        description: >
          Addition, correction or updating of husband or wife
          information recorded on the NID.
        includes:
          - "Incorrect spouse name"
          - "Spouse-name spelling correction"
          - "Adding husband or wife name"
          - "Updating spouse information"
          - "Documents or procedure for spouse-name correction"
        excludes:
          - "Changing only married/unmarried status"

      NID_CORRECTION_ADDRESS:
        display_name: "Address Correction"
        description: >
          Correction, addition or updating of address information
          recorded on an existing NID.
        includes:
          - "Incorrect address"
          - "Current address missing"
          - "Address update after moving"
          - "Incorrect village or area name"
          - "Documents or procedure for address correction"
        excludes:
          - "Transferring the citizen's voter area"
          - "Choosing a voter area during first-time registration"

      NID_CORRECTION_PHOTO:
        display_name: "Photo Change or Correction"
        description: >
          Updating or replacing the photograph associated with
          an existing NID.
        includes:
          - "Old photograph"
          - "Poor-quality photograph"
          - "Request to provide a new photograph"
          - "Photo-change procedure"
        excludes:
          - "Biometric photograph taken during first-time registration"

      NID_CORRECTION_SIGNATURE:
        display_name: "Signature Change or Correction"
        description: >
          Correction, replacement or updating of the signature
          associated with an existing NID.
        includes:
          - "Incorrect signature"
          - "Old signature needs replacement"
          - "Changed signature"
          - "Signature-update procedure"
          - "Requirements for signature correction"

  NID_REPLACEMENT:
    display_name: "Lost, Stolen, Damaged or Duplicate NID"
    description: >
      Replacement, duplicate or reissue procedures for an NID
      that has been lost, stolen, damaged or otherwise requires
      replacement.

    covers:
      - "Lost NID"
      - "Stolen NID"
      - "Damaged NID"
      - "NID Reissue / Replacement"
      - "Duplicate NID"
      - "Lost or Damaged Smart NID Replacement"

    query_topics:

      NID_REPLACEMENT_PROCESS:
        display_name: "NID Replacement or Reissue Process"
        description: >
          General questions about what to do and how to obtain
          another NID after loss, theft, damage or another
          replacement situation.
        includes:
          - "NID lost, what should I do?"
          - "How to replace a lost NID"
          - "How to reissue an NID"
          - "Replacement procedure"
          - "Damaged NID replacement process"
          - "Lost Smart NID replacement process"
        excludes:
          - "Questions specifically asking whether replacement is allowed"
          - "Questions specifically asking for documents"
          - "Questions specifically about filing a GD"
          - "Application tracking or status"
          - "Fee or payment questions"

      NID_REPLACEMENT_ELIGIBILITY:
        display_name: "Replacement Eligibility"
        description: >
          Questions asking whether an NID in a particular condition
          can be replaced or reissued.
        includes:
          - "Can a damaged NID be replaced?"
          - "Can I get another card after losing my NID?"
          - "Is reissue available for a lost or damaged NID?"
          - "Can a lost Smart NID be replaced?"
        excludes:
          - "How to perform the replacement"

      NID_REPLACEMENT_REQUIRED_DOCUMENTS:
        display_name: "Replacement Required Documents"
        description: >
          Questions asking which documents, papers or supporting
          evidence are required for NID replacement or reissue.
        includes:
          - "Documents required for lost NID replacement"
          - "Documents needed for reissue"
          - "Supporting documents"
          - "Whether birth registration is required"
          - "Documents needed for Smart NID replacement"
        excludes:
          - "Documents needed specifically to file the police GD"
          - "Fee or payment questions"

      NID_REPLACEMENT_GD_REPORTING:
        display_name: "Lost NID GD and Police Reporting"
        description: >
          Questions about reporting a lost or stolen NID to police,
          whether a General Diary is required, how to file it and
          what is needed for the GD.
        includes:
          - "Do I need a GD for a lost NID?"
          - "How to file a GD"
          - "Where to report a lost NID"
          - "What documents are needed for the GD"
          - "What information must be provided in the GD"
          - "Whether the GD copy is needed for reissue"
        excludes:
          - "General replacement documents unrelated to the GD"
          - "Police GD questions unrelated to an NID"

      NID_REPLACEMENT_APPLICATION_LOCATION:
        display_name: "Replacement Application Location"
        description: >
          Questions about where a citizen should submit an NID
          replacement or reissue application.
        includes:
          - "Where to apply for NID reissue"
          - "Which office handles replacement"
          - "Where to submit a lost-NID replacement request"
          - "Where to apply for Smart NID replacement"
        excludes:
          - "Questions specifically asking about online application"

      NID_REPLACEMENT_ONLINE_APPLICATION:
        display_name: "Online Replacement Application"
        description: >
          Questions about whether or how an NID replacement or
          reissue application can be performed online.
        includes:
          - "Can I apply for NID reissue online?"
          - "Online lost-NID replacement"
          - "Online replacement application procedure"
        excludes:
          - "NID portal login or account problems"
          - "Application status tracking"

      NID_REPLACEMENT_PROCESSING_TIME:
        display_name: "Normal Replacement Processing Time"
        description: >
          Questions asking how long an NID replacement or reissue
          normally takes.
        includes:
          - "How many days does replacement take?"
          - "Normal reissue processing time"
          - "Expected time to receive the replacement card"
        excludes:
          - "An already delayed replacement application"
          - "Checking the status of a submitted replacement request"

  NID_ONLINE_SERVICES:
    display_name: "NID Online Account and Portal"
    description: >
      NID portal account creation, login, password and account
      recovery, OTP and identity verification, account management,
      portal availability and other online-service access issues.

    covers:
      - "NID Online Account Registration"
      - "NID Services Registration"
      - "NID Account Login"
      - "NID Portal Login Problem"
      - "Forgotten Password / Password Reset"
      - "NID Account Recovery"
      - "OTP Not Received"
      - "OTP Verification Problem"
      - "Face Verification Problem"
      - "Biometric Verification Problem"
      - "NID Portal Not Working"
      - "NID Account Information Update"
      - "NID Account Deactivation"
      - "General NID Online Service Problem"

    query_topics:

      NID_ONLINE_ACCOUNT_REGISTRATION:
        display_name: "Online Account Registration"
        description: >
          Questions about creating, registering, signing up for or
          activating an NID online-services account.
        includes:
          - "How to create an NID online account"
          - "How to register for NID online services"
          - "Where the portal registration option is"
          - "Information required to create an account"
          - "Whether registration can be completed using a phone"
          - "Problems encountered while creating an account"
          - "Activating online-service access"
        excludes:
          - "First-time voter/NID registration"
          - "Logging into an existing online account"
          - "Recovering an existing account"

      NID_ONLINE_LOGIN:
        display_name: "Online Account Login"
        description: >
          Questions asking how or where to sign in to an existing
          NID online account.
        includes:
          - "How to log in"
          - "Where the login page is"
          - "How to sign in after creating an account"
          - "How to access an existing NID account"
        excludes:
          - "Login attempts that are failing"
          - "Forgotten-password problems"
          - "Account recovery"

      NID_ONLINE_LOGIN_PROBLEM:
        display_name: "Online Account Login Problem"
        description: >
          Problems where the citizen has an existing NID account
          but cannot successfully log in or access it normally.
        includes:
          - "Login is not working"
          - "Correct information entered but login fails"
          - "Login error"
          - "Sign-in repeatedly fails"
          - "Cannot access account despite having credentials"
        excludes:
          - "Citizen forgot the password"
          - "Citizen lost broader access to the account"
          - "The entire NID portal appears unavailable"

      NID_ONLINE_PASSWORD_RESET:
        display_name: "Forgotten Password and Password Reset"
        description: >
          Questions about a forgotten NID online-account password,
          resetting it, changing it through the recovery flow or
          problems completing a password reset.
        includes:
          - "Forgot NID account password"
          - "How to reset password"
          - "Where the forgot-password option is"
          - "How to create a new password"
          - "Password reset is not working"
          - "Password-reset link or procedure"
        excludes:
          - "Normal login with a known password"
          - "Loss of account access unrelated to only the password"

      NID_ONLINE_ACCOUNT_RECOVERY:
        display_name: "Online Account Recovery"
        description: >
          Questions about recovering or regaining access to an
          existing NID online account when the citizen has lost
          broader account access or account information.
        includes:
          - "Recover old NID online account"
          - "Lost access to account"
          - "Regain access to existing account"
          - "Account recovery option"
          - "Missing login information"
          - "Recover an old account"
        excludes:
          - "Only forgetting or resetting the password"
          - "Creating a completely new account"

      NID_ONLINE_OTP_NOT_RECEIVED:
        display_name: "OTP Not Received"
        description: >
          Problems where an NID verification OTP or verification
          code has been requested but has not arrived.
        includes:
          - "OTP did not arrive"
          - "OTP SMS not received"
          - "Verification code not received"
          - "OTP is taking too long"
          - "Repeated OTP requests produce no SMS"
        excludes:
          - "An OTP was received but is rejected"
          - "Face or biometric verification"

      NID_ONLINE_OTP_VERIFICATION:
        display_name: "OTP Verification Problem"
        description: >
          Problems where an OTP has been received but verification
          cannot be completed successfully.
        includes:
          - "Correct OTP is rejected"
          - "OTP verification fails"
          - "OTP expired"
          - "Portal does nothing after OTP submission"
          - "Account verification remains incomplete"
        excludes:
          - "OTP never arrived"
          - "Face verification"
          - "Fingerprint or other biometric verification"

      NID_ONLINE_FACE_VERIFICATION:
        display_name: "Face Verification Problem"
        description: >
          Problems involving face detection or face verification
          during NID online-account verification.
        includes:
          - "Face verification fails"
          - "Portal cannot detect face"
          - "Face image is not accepted"
          - "Repeated face-verification failure"
          - "Error during face verification"
        excludes:
          - "Fingerprint verification"
          - "General biometric issue with no face reference"
          - "OTP verification"

      NID_ONLINE_BIOMETRIC_VERIFICATION:
        display_name: "Biometric Verification Problem"
        description: >
          Problems involving fingerprint or other non-face biometric
          verification for NID online services.
        includes:
          - "Fingerprint is not recognized"
          - "Biometric verification fails"
          - "Biometric information does not match"
          - "Fingerprint detection problem"
          - "Cannot complete biometric verification"
        excludes:
          - "Face-specific verification"
          - "OTP verification"

      NID_ONLINE_PORTAL_UNAVAILABLE:
        display_name: "NID Portal Not Working"
        description: >
          Problems indicating that the NID portal or website itself
          is unavailable, failing to load or returning general
          system-level errors.
        includes:
          - "NID portal is down"
          - "Website does not open"
          - "Page does not load"
          - "Portal repeatedly returns errors"
          - "Online-service website appears unavailable"
        excludes:
          - "A login-only problem while the portal otherwise works"
          - "A specific OTP or verification problem"
          - "An unspecified problem with one online service"

      NID_ONLINE_ACCOUNT_INFORMATION_UPDATE:
        display_name: "Online Account Information Update"
        description: >
          Questions about editing or updating information associated
          with the citizen's NID online-account profile.
        includes:
          - "Update account information"
          - "Change linked mobile number"
          - "Update contact information"
          - "Edit online profile"
          - "Correct information entered in the online account"
        excludes:
          - "Correcting information printed or stored on the actual NID"
          - "NID name, DOB, address or other official-record correction"

      NID_ONLINE_ACCOUNT_DEACTIVATION:
        display_name: "Online Account Deactivation"
        description: >
          Questions about closing, deleting, deactivating or
          reactivating an NID online account.
        includes:
          - "Deactivate account"
          - "Close old account"
          - "Delete account"
          - "Permanent account deactivation"
          - "Whether a deactivated account can be reactivated"
        excludes:
          - "Recovering an account because access was lost"

      NID_ONLINE_GENERAL_PROBLEM:
        display_name: "General Online Service Problem"
        description: >
          Online NID service problems where the citizen reports
          difficulty but does not identify a sufficiently specific
          account, login, OTP, verification or portal issue.
        includes:
          - "NID online service is not working"
          - "Cannot complete an online service"
          - "General online-service error"
          - "Unspecified NID portal problem"
          - "Where to get help for an online-service problem"
        excludes:
          - "A clearly identifiable login problem"
          - "A clearly identifiable OTP problem"
          - "Face or biometric verification"
          - "The entire portal being unavailable"

  NID_SMART_CARD:
    display_name: "Smart NID Card"
    description: >
      Smart NID eligibility, registration/application, issuance
      status, collection, distribution, delay and general
      Smart Card service problems.

    covers:
      - "Smart NID Eligibility"
      - "Smart NID Registration"
      - "Smart NID Application"
      - "Smart NID Status"
      - "Smart NID Collection Location"
      - "Smart NID Distribution Date"
      - "Smart NID Delay"
      - "General Smart NID Problems"

    query_topics:

      NID_SMART_ELIGIBILITY:
        display_name: "Smart NID Eligibility"
        description: >
          Questions about who is eligible to receive a Smart NID,
          what conditions apply, or whether a particular citizen
          qualifies for one.
        includes:
          - "Who can receive a Smart NID?"
          - "Am I eligible for a Smart NID?"
          - "Can a new voter receive a Smart NID?"
          - "Can an existing NID holder receive one?"
          - "Is there an age requirement?"
          - "What are the eligibility conditions?"
        excludes:
          - "How to register for Smart NID"
          - "How to apply after eligibility is known"

      NID_SMART_REGISTRATION:
        display_name: "Smart NID Registration"
        description: >
          Questions specifically about whether Smart NID requires
          separate registration and how or where that registration
          is performed.
        includes:
          - "Do I need to register separately for Smart NID?"
          - "How do I register?"
          - "Where can I register?"
          - "Can Smart NID registration be done online?"
          - "Registration procedure"
        excludes:
          - "General Smart NID application procedure"
          - "First-time voter/NID registration"

      NID_SMART_APPLICATION:
        display_name: "Smart NID Application"
        description: >
          Questions about applying for a Smart NID, application
          procedure, application requirements and submission.
        includes:
          - "How do I apply for a Smart NID?"
          - "Smart NID application process"
          - "Where to apply"
          - "Can I apply online?"
          - "Documents needed to apply"
          - "What should I do to obtain a Smart NID?"
        excludes:
          - "Checking an already submitted application"
          - "Generic Smart NID eligibility"
          - "Smart NID fee questions"

      NID_SMART_STATUS:
        display_name: "Smart NID Status"
        description: >
          Questions about checking whether a Smart NID has been
          issued, produced, approved or is ready after an
          application or registration process.
        includes:
          - "How do I check Smart NID status?"
          - "Has my Smart NID been produced?"
          - "Is my card ready?"
          - "Where can I check status?"
          - "Can status be checked online?"
          - "Is the Smart NID ready for collection?"
        excludes:
          - "Where to collect the card"
          - "When distribution will occur"
          - "A card that is explicitly delayed"

      NID_SMART_COLLECTION_LOCATION:
        display_name: "Smart NID Collection Location"
        description: >
          Questions about where and how a citizen should collect
          an issued Smart NID card.
        includes:
          - "Where can I collect my Smart NID?"
          - "Where is my collection center?"
          - "Which election office should I visit?"
          - "How do I find my collection location?"
          - "Can another person collect it for me?"
          - "What is required when collecting the card?"
        excludes:
          - "Whether the card is ready"
          - "When distribution starts"

      NID_SMART_DISTRIBUTION_DATE:
        display_name: "Smart NID Distribution Date"
        description: >
          Questions about when Smart NID distribution starts,
          the announced or local distribution date, and whether
          distribution has begun in an area.
        includes:
          - "When will Smart NID cards be distributed?"
          - "What is the distribution date?"
          - "When will distribution start?"
          - "Has distribution started?"
          - "When will cards be distributed in my area?"
          - "Where can I find the local distribution date?"
        excludes:
          - "Where the collection center is"
          - "A citizen whose expected card is already delayed"

      NID_SMART_DELAY:
        display_name: "Smart NID Delay"
        description: >
