taxonomy_version: "0.1.3"
service_id: "PASSPORT"
status: "query_topics_in_progress"

description: >
  Working parent-topic taxonomy for Bangladesh e-Passport citizen
  queries. The parent topics have been reviewed and specific
  query-topic definitions are being added incrementally. The taxonomy
  will undergo structural and semantic review before it is considered
  complete.

id_prefix: "PASS"

parent_topics:

  PASSPORT_APPLICATION:
    display_name: "New Passport Application"
    description: >
      First-time or new e-Passport application questions, including
      the overall application process, online application, application
      information, passport type choices, selection of the responsible
      passport office and new-passport application from abroad through
      an appropriate Bangladesh mission.

    default_evidence_status: "official_workflow_supported"

    covers:
      - "New / First Passport Application"
      - "Online Passport Application"
      - "Application Process"
      - "Application Information"
      - "Passport Type / Validity / Page Selection"
      - "Passport Office Selection"
      - "Regional Passport Office"
      - "Application Location"
      - "Application From Abroad / Bangladesh Mission"
      - "Official / Diplomatic Passport Application"

    query_topics:

      PASSPORT_APPLICATION_PROCESS:
        display_name: "New Passport Application Process"
        description: >
          General or end-to-end questions about how to apply for a new
          Bangladesh e-Passport when the user is not specifically asking
          about one narrower application sub-step.

        evidence_status: "official_workflow_supported"

        includes:
          - "How do I apply for a new passport?"
          - "What is the process for getting my first e-Passport?"
          - "Where do I start a new passport application?"
          - "How can I get a passport for the first time?"

        excludes:
          - "Questions specifically about applying through the online portal"
          - "Questions specifically about which passport office to select"
          - "Questions specifically about required documents"
          - "Questions about re-issuing a previously issued passport"
          - "Questions specifically about passport type, validity or page options"


      PASSPORT_APPLICATION_ONLINE:
        display_name: "Online Passport Application"
        description: >
          Questions specifically about starting, completing or submitting
          a new passport application through the Bangladesh e-Passport
          online application system.

        evidence_status: "official_workflow_supported"

        includes:
          - "Can I apply for a passport online?"
          - "How do I submit a new passport application online?"
          - "Where is the online passport application form?"
          - "How do I complete the e-Passport application through the portal?"

        excludes:
          - "Creating or logging into an e-Passport portal account"
          - "Forgotten password or account activation problems"
          - "General new-passport process questions without an online focus"
          - "Checking the status of an already submitted application"


      PASSPORT_APPLICATION_OFFICE_SELECTION:
        display_name: "Passport Office Selection"
        description: >
          Questions about determining or selecting the Regional Passport
          Office or other responsible application location for a new
          passport application.

        evidence_status: "official_workflow_supported"

        includes:
          - "Which passport office should I select?"
          - "Which Regional Passport Office handles my application?"
          - "How do I choose the passport office from my present address?"
          - "Which office should I use for my district or police station?"

        excludes:
          - "Entering the applicant's address in the application form"
          - "Finding where biometric enrolment happens after application"
          - "Passport collection questions"
          - "Applying specifically through a Bangladesh mission abroad"


      PASSPORT_APPLICATION_INFORMATION:
        display_name: "Passport Application Information"
        description: >
          Questions about the personal or application-form information that
          must be entered when completing a new passport application.

        evidence_status: "official_workflow_supported"

        includes:
          - "What information do I need to enter in the passport application?"
          - "What personal information is required in the application form?"
          - "How should I fill in my passport application details?"
          - "What information does the new passport form ask for?"

        excludes:
          - "Questions about documents that prove the entered information"
          - "Questions about NID or Birth Registration document requirements"
          - "Correcting information on a previously issued passport"
          - "Changing information during passport re-issue"


      PASSPORT_APPLICATION_PASSPORT_OPTIONS:
        display_name: "Passport Type, Validity and Page Options"
        description: >
          Questions about selectable passport characteristics or application
          choices such as available passport type, validity period, number of
          pages or similar passport-option selections.

        evidence_status: "official_workflow_supported"

        includes:
          - "Which passport validity option should I select?"
          - "What page options are available for an e-Passport?"
          - "How do I choose the passport type?"
          - "What passport options can I select while applying?"

        excludes:
          - "Questions only about the price of different passport options"
          - "Questions only about regular or express delivery"
          - "General new-passport application process questions"
          - "Re-issue questions for an existing passport"


      PASSPORT_APPLICATION_OVERSEAS:
        display_name: "New Passport Application From Abroad"
        description: >
          Questions about making a new or first passport application while
          living outside Bangladesh through an appropriate Bangladesh
          embassy or mission.

        evidence_status: "official_workflow_supported"

        includes:
          - "How do I apply for a new passport from abroad?"
          - "Can I apply for my first passport through a Bangladesh embassy?"
          - "Which Bangladesh mission should handle my new passport application?"
          - "How does new passport application work while living overseas?"

        excludes:
          - "Re-issuing an existing passport while abroad"
          - "General domestic passport-office selection"
          - "Visa or immigration-service questions"
          - "Birth Registration services through an embassy"


      PASSPORT_APPLICATION_OFFICIAL_DIPLOMATIC:
        display_name: "Official or Diplomatic Passport Application"
        description: >
          Questions specifically about applying for an official or diplomatic
          passport category rather than an ordinary citizen e-Passport.

        evidence_status: "needs_query_volume_review"

        includes:
          - "How do I apply for an official passport?"
          - "What is the application process for a diplomatic passport?"
          - "How does a government employee apply for an official passport?"
          - "I need an official passport; how do I apply?"

        excludes:
          - "Questions specifically asking which GO or NOC documents are required"
          - "General ordinary e-Passport applications"
          - "General document-requirement questions"
          - "Re-issue of an existing official or diplomatic passport"


  PASSPORT_DOCUMENTS:
    display_name: "Passport Documents and Requirements"
    description: >
      Questions about documents and supporting evidence required for
      an e-Passport application or enrolment, including identity
      documents, previous passport, minor-applicant documents,
      special-category supporting documents and situations where
      required documents are unavailable.

    default_evidence_status: "official_workflow_supported"

    covers:
      - "Required Documents"
      - "NID Requirement"
      - "Birth Registration Requirement"
      - "Previous Passport Requirement"
      - "Minor Applicant Documents"
      - "Supporting Documents"
      - "Documents for Enrolment"
      - "Missing / Unavailable Documents"
      - "Official / Diplomatic Passport Documents"
      - "GO / Government Order"
      - "NOC / No Objection Certificate"

    query_topics:

      PASSPORT_DOCUMENTS_REQUIRED:
        display_name: "General Passport Required Documents"
        description: >
          General questions asking which documents or supporting papers
          are required for a passport application when the user does not
          focus on one specific document type or applicant category.

        evidence_status: "official_workflow_supported"

        includes:
          - "What documents do I need for a passport application?"
          - "Which papers are required for a new passport?"
          - "What documents should I prepare before applying?"
          - "Give me the general passport document checklist."

        excludes:
          - "Questions specifically about whether NID is required"
          - "Questions specifically about Birth Registration requirements"
          - "Questions specifically about a previous passport"
          - "Questions about missing or unavailable documents"
          - "Questions specifically about documents for minors"


      PASSPORT_DOCUMENTS_NID_REQUIREMENT:
        display_name: "NID Requirement for Passport"
        description: >
          Questions specifically about whether, when or how a National
          Identity Card is required as supporting identity evidence for
          passport-related processing.

        evidence_status: "official_workflow_supported"

        includes:
          - "Do I need an NID to apply for a passport?"
          - "Is NID mandatory for an e-Passport?"
          - "Can I apply using my NID?"
          - "Does passport application require NID information?"

        excludes:
          - "Questions specifically about Birth Registration documents"
          - "Questions about correcting NID information"
          - "General passport document-checklist questions"
          - "Questions about a missing NID document without a passport context"


      PASSPORT_DOCUMENTS_BIRTH_REGISTRATION_REQUIREMENT:
        display_name: "Birth Registration Requirement for Passport"
        description: >
          Questions specifically about using or requiring a Birth
          Registration Certificate or Birth Registration Number as
          identity evidence in a passport application.

        evidence_status: "official_workflow_supported"

        includes:
          - "Can I use Birth Registration for passport application?"
          - "Is a Birth Registration Certificate required for a passport?"
          - "Do I need my birth certificate for an e-Passport?"
          - "Can a passport application use a Birth Registration Number?"

        excludes:
          - "Questions specifically about NID requirements"
          - "Birth Registration correction or verification services"
          - "General passport document-checklist questions"
          - "Questions about obtaining a Birth Registration Certificate"


      PASSPORT_DOCUMENTS_PREVIOUS_PASSPORT:
        display_name: "Previous Passport Document Requirement"
        description: >
          Questions specifically about providing an existing or previous
          passport as a supporting document during passport processing,
          especially where the applicant already held a passport.

        evidence_status: "official_workflow_supported"

        includes:
          - "Do I need to bring my old passport?"
          - "Is my previous passport required for re-issue?"
          - "Do I have to submit the existing passport during enrolment?"
          - "Why is the previous passport needed?"

        excludes:
          - "General passport re-issue process questions"
          - "Lost passport replacement questions"
          - "Stolen passport questions"
          - "General required-document questions"


      PASSPORT_DOCUMENTS_MINOR_APPLICANT:
        display_name: "Documents for Minor Passport Applicant"
        description: >
          Questions specifically about supporting documents or identity
          evidence required when the passport applicant is a child or
          minor.

        evidence_status: "official_workflow_supported"

        includes:
          - "What documents are needed for a child's passport?"
          - "Which papers are required for a minor passport applicant?"
          - "What parent documents are needed for my child's passport?"
          - "What documents do I need when applying for my child?"

        excludes:
          - "General passport application process for adults"
          - "General document requirements without a minor-applicant focus"
          - "Birth Registration questions not specifically related to a minor passport"
          - "General parental-information fields in an application form"


      PASSPORT_DOCUMENTS_ENROLMENT:
        display_name: "Documents Required for Passport Enrolment"
        description: >
          Questions specifically about which application papers,
          identity documents, receipts or other supporting documents
          should be taken to the physical passport enrolment stage.

        evidence_status: "official_workflow_supported"

        includes:
          - "What documents should I bring to passport enrolment?"
          - "Which papers do I need to carry on enrolment day?"
          - "What documents are needed when I go for biometrics?"
          - "What paperwork should I take to the passport office after applying?"

        excludes:
          - "General passport document requirements before starting an application"
          - "Appointment scheduling problems"
          - "Questions about how biometric enrolment itself works"
          - "Passport collection document requirements after issuance"


      PASSPORT_DOCUMENTS_MISSING:
        display_name: "Missing or Unavailable Passport Document"
        description: >
          Questions where the applicant knows or believes that a
          supporting passport document is required but cannot provide,
          locate or obtain that document.

        evidence_status: "needs_query_pilot"

        includes:
          - "One of my passport documents is missing; what should I do?"
          - "I cannot provide a required document for my passport application."
          - "What happens if I do not have one of the required papers?"
          - "A required passport document is unavailable. Can I still apply?"

        excludes:
          - "General questions asking which documents are required"
          - "Lost passport questions where the missing object is the passport itself"
          - "Lost delivery-slip questions"
          - "Questions about obtaining or correcting another government document"


      PASSPORT_DOCUMENTS_OFFICIAL_DIPLOMATIC:
        display_name: "Official or Diplomatic Passport Documents"
        description: >
          Questions specifically about supporting administrative
          documentation for official or diplomatic passport applications,
          including Government Order or No Objection Certificate related
          requirements where applicable.

        evidence_status: "needs_query_volume_review"

        includes:
          - "What documents are required for an official passport?"
          - "Do I need an NOC for an official passport?"
          - "Is a Government Order needed for a diplomatic passport application?"
          - "Which supporting papers are needed for a government employee passport?"

        excludes:
          - "General questions about how to apply for an official passport"
          - "Ordinary citizen passport document requirements"
          - "General NID or Birth Registration questions"
          - "Re-issue questions not specifically about supporting documentation"


  PASSPORT_ONLINE_ACCOUNT:
    display_name: "Passport Online Account"
    description: >
      Questions about creating, accessing or recovering an e-Passport
      portal account, including login credentials, password recovery,
      account activation and registered contact-information problems.

    default_evidence_status: "official_service_supported"

    covers:
      - "Online Account Registration"
      - "Account Login"
      - "Forgotten Password"
      - "Password Reset"
      - "Account Activation"
      - "Activation Email Not Received"
      - "Registered Email Change"
      - "Registered Mobile Number Change"
      - "Account Access Problems"

    query_topics: {}


  PASSPORT_APPOINTMENT_AND_ENROLMENT:
    display_name: "Passport Appointment and Enrolment"
    description: >
      Questions about appointment scheduling and the physical
      enrolment stage of the e-Passport process, including attendance,
      enrolment preparation and appointment-related problems.

    default_evidence_status: "official_service_supported"

    covers:
      - "Appointment Scheduling"
      - "Appointment Date"
      - "Appointment Problems"
      - "Appointment Requirements"
      - "Enrolment Process"
      - "Enrolment Location"
      - "Enrolment Preparation"
      - "Biometric Enrolment"

    query_topics: {}


  PASSPORT_REISSUE:
    display_name: "Passport Re-Issue and Replacement"
    description: >
      Questions about obtaining another passport after a previous
      passport has already been issued. This includes ordinary
      re-issue, expiry, loss, theft, damage, overseas re-issue and
      re-issue caused by changes in passport information.

    default_evidence_status: "official_workflow_supported"

    covers:
      - "Passport Re-Issue"
      - "Expired Passport"
      - "Expiring Passport"
      - "Re-Issue Without Information Change"
      - "Re-Issue With Information Change"
      - "Lost Passport"
      - "Stolen Passport"
      - "Damaged Passport"
      - "Replacement Passport"
      - "Changed Personal Information"
      - "Overseas Passport Re-Issue"

    query_topics: {}


  PASSPORT_FEES_AND_PAYMENT:
    display_name: "Passport Fees and Payment"
    description: >
      Questions about e-Passport fees and payment workflows, including
      payment methods, payment confirmation, receipts, failed
      transactions and delivery-category fee questions.

    default_evidence_status: "official_service_supported"

    covers:
      - "Passport Fee Information"
      - "Payment Method"
      - "Online Payment"
      - "Offline Payment"
      - "Payment Confirmation"
      - "Payment Failure"
      - "Money Deducted but Payment Failed"
      - "Payment Receipt"
      - "Payment Slip"
      - "Delivery Category Fee"

    query_topics: {}


  PASSPORT_STATUS_AND_DELIVERY:
    display_name: "Passport Application Status and Delivery"
    description: >
      Questions about the state of a submitted passport application,
      expected processing duration, unusual delay, delivery category,
      passport readiness and collection of an issued passport.

    default_evidence_status: "official_service_supported"

    covers:
      - "Application Status"
      - "Application Stage"
      - "Application Approval"
      - "Application Delay"
      - "Processing Time"
      - "Regular Delivery"
      - "Express Delivery"
      - "Urgent / Super Express Delivery"
      - "Passport Ready for Collection"
      - "Passport Collection"
      - "Delivery Slip"

    query_topics: {}


  PASSPORT_GENERAL_INFORMATION:
    display_name: "General Passport Information"
    description: >
      General questions about Bangladesh e-Passport services when the
      user is seeking broad information and does not express a more
      specific operational intent.

    default_evidence_status: "needs_query_pilot"

    covers:
      - "What is an e-Passport?"
      - "General Passport Information"
      - "New Passport vs Re-Issue"
      - "General Passport Service Guidance"

    query_topics: {}


design_rules:

  - >
    Parent topics represent broad citizen information needs. Specific
    classifier intents are represented by query-topic IDs beneath each
    parent.

  - >
    Passport office selection remains inside PASSPORT_APPLICATION
    unless pilot evidence shows that it requires a separate parent.

  - >
    Lost, stolen and damaged passport cases remain inside
    PASSPORT_REISSUE because each normally concerns obtaining another
    passport after a previous passport existed. They may later become
    distinct query-topic leaves.

  - >
    Information change connected to an already issued passport remains
    inside PASSPORT_REISSUE unless semantic review shows that a separate
    parent is required.

  - >
    Passport collection remains inside PASSPORT_STATUS_AND_DELIVERY
    unless query volume and semantic separation justify its own parent.

  - >
    Required documents and missing documents are separate specific
    intents. Asking which documents are required is different from
    already knowing a document is required but being unable to provide
    it.

  - >
    NID requirement and Birth Registration requirement are represented
    separately because citizens frequently ask specifically whether one
    identity document can or must be used for passport processing.

  - >
    Questions about a previous passport as a required supporting
    document remain under PASSPORT_DOCUMENTS, while the actual process
    of obtaining another passport remains under PASSPORT_REISSUE.

  - >
    Documents required at physical enrolment remain under
    PASSPORT_DOCUMENTS, while questions about scheduling or performing
    enrolment remain under PASSPORT_APPOINTMENT_AND_ENROLMENT.

  - >
    Application status, application delay and normal processing time
    must later receive distinct semantic-boundary review.

  - >
    Payment information and payment failure must not automatically use
    the same specific-intent label.

  - >
    A lost passport and a lost delivery slip are different objects and
    must never be represented by the same query-topic label.

  - >
    Portal account problems and appointment problems must remain
    semantically distinct even though both occur during the online
    passport workflow.

  - >
    Overseas status is a contextual attribute rather than a first-level
    intent parent. New-passport questions from abroad belong under
    PASSPORT_APPLICATION, while re-issue questions from abroad belong
    under PASSPORT_REISSUE. Overseas-specific leaves may be created
    only where semantic evidence justifies them.

  - >
    Official or diplomatic passport status is a contextual/application
    category rather than a first-level intent parent. Application
    questions belong under PASSPORT_APPLICATION, while supporting
    document questions such as GO or NOC belong under
    PASSPORT_DOCUMENTS. Dedicated leaves require sufficient query
    evidence.

  - >
    Mutable facts such as current fees, processing durations, passport
    office addresses, eligibility details and payment providers must
    not be encoded in the taxonomy. Those belong in the verified
    knowledge corpus.

  - >
    General information must not be used as a fallback for unsupported
    or low-confidence queries. OOD and confidence handling will handle
    unsupported cases.


evidence_notes:

  PASSPORT_APPLICATION:
    evidence_status: "official_workflow_supported"

  PASSPORT_DOCUMENTS:
    evidence_status: "official_workflow_supported"

  PASSPORT_ONLINE_ACCOUNT:
    evidence_status: "official_service_supported"

  PASSPORT_APPOINTMENT_AND_ENROLMENT:
    evidence_status: "official_service_supported"

  PASSPORT_REISSUE:
    evidence_status: "official_workflow_supported"

  PASSPORT_FEES_AND_PAYMENT:
    evidence_status: "official_service_supported"

  PASSPORT_STATUS_AND_DELIVERY:
    evidence_status: "official_service_supported"

  PASSPORT_GENERAL_INFORMATION:
    evidence_status: "needs_query_pilot"


freeze_status:
  shared_contract_frozen: false

  parent_topics_reviewed: true
  query_topics_defined: false
  inclusion_exclusion_rules_defined: false
  semantic_audit_passed: false

  pilot_dataset_created: false
  taxonomy_ready_for_shared_contract: false