<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#147d6a">
    <title>NagorikSheba AI</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/main.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" aria-label="NagorikSheba AI">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>NagorikSheba <strong>AI</strong></span>
        </div>
        <div id="service-status" class="service-status" role="status">Checking service</div>
      </div>
    </header>

    <main class="layout">
      <section class="workspace" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow">Citizen service guidance</p>
          <h1 id="page-title">How can we help?</h1>
        </div>

        <form id="query-form" class="query-form">
          <label for="query">Your question</label>
          <textarea id="query" name="query" rows="4" maxlength="4000" autocomplete="off" required placeholder="Ask about NID, birth registration, passport, tax, online GD, or a driving licence"></textarea>
          <div class="form-actions">
            <span id="character-count" class="character-count">0 / 4000</span>
            <div class="action-buttons">
              <button id="clear-button" type="button" class="secondary-button">Clear</button>
              <button id="submit-button" type="submit" class="primary-button">Get guidance</button>
            </div>
          </div>
        </form>

        <section id="result" class="result" aria-live="polite" hidden>
          <div id="result-accent" class="result-accent"></div>
          <div class="result-content">
            <p id="result-kicker" class="result-kicker"></p>
            <h2 id="result-title"></h2>
            <p id="result-body" class="result-body"></p>
            <p id="scope-note" class="scope-note" hidden></p>
            <div id="privacy-notice" class="privacy-notice" hidden>
              <strong>Privacy notice</strong>
              <p id="privacy-message"></p>
            </div>
            <div id="result-source" class="result-source" hidden>
              <span class="source-label">Official source</span>
              <a id="source-link" target="_blank" rel="noopener noreferrer"></a>
              <span id="source-date" class="source-date"></span>
            </div>
            <div id="result-meta" class="result-meta" hidden>
              <span id="service-name"></span>
              <span id="topic-name"></span>
              <span id="priority-name"></span>
            </div>
          </div>
        </section>
      </section>

      <aside class="sidebar" aria-label="Supported services">
        <h2>Services</h2>
        <ul>
          <li><span class="service-index">01</span>National ID</li>
          <li><span class="service-index">02</span>Birth registration</li>
          <li><span class="service-index">03</span>Passport</li>
          <li><span class="service-index">04</span>Tax</li>
          <li><span class="service-index">05</span>Police general diary</li>
          <li><span class="service-index">06</span>Driving licence</li>
        </ul>
      </aside>
    </main>
  </body>
</html>
